version: '3.7'
services:
  wukongim: # WuKongIM服务
    image: registry.cn-shanghai.aliyuncs.com/wukongim/wukongim:v2
    environment:
      - "WK_CLUSTER_NODEID=1001"  
      - "WK_CLUSTER_SERVERADDR=wukongim.zeabur.internal:11110" # 节点内部通信请求地址
      - "WK_TRACE_PROMETHEUSAPIURL=http://wukongim.zeabur.internal:9090" # prometheus监控地址
      - "WK_MODE=release" # release模式
      - "WK_EXTERNAL_IP=qihangtong.zeabur.app" # 服务器外网ip
      - "WK_CLUSTER_APIURL=http://wukongim.zeabur.internal:5001" # api的内网地址
      - "WK_INTRANET_TCPADDR=wukongim.zeabur.internal:5100" # tcp连接的内网地址，此配置主要用于压测
    healthcheck:
      test: "wget -q -Y off -O /dev/null http://localhost:5001/health > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 3       
    restart: always  
    ports:
      - 5001:5001 # http api 端口
      - 5100:5100 # tcp端口
      - 5200:5200 # websocket端口
      - 5300:5300 # 管理端端口
      - 5172:5172 # demo端口
      - 11110:11110 # 分布式节点通讯端口
  prometheus:  # 监控服务
    build: ./prometheus
